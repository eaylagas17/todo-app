name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: todo
          POSTGRES_PASSWORD: todo
          POSTGRES_DB: todo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U todo -d todo_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
      - run: uv sync --frozen
      - run: uv run ruff check
      - run: uv run ruff format --check
      - name: Tests on SQLite, with coverage
        run: uv run pytest --cov=app --cov-report=term-missing
      - name: Tests on Postgres
        run: uv run pytest
        env:
          TEST_DATABASE_URL: postgresql+psycopg://todo:todo@localhost:5432/todo_test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm run coverage
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker compose up -d --build --wait
      - run: curl --fail-with-body http://localhost:8000/api/health
      - name: Sign in as the demo user
        run: >-
          curl --fail-with-body -X POST http://localhost:8000/api/sessions
          -H "Content-Type: application/json"
          -d '{"email": "demo@example.com", "password": "demo-password"}'
      - name: No debug output or leftover notes in the code
        run: "! git grep -nE 'console\\.log|print\\(|TODO|FIXME' -- backend/app frontend/src"
      - if: always()
        run: docker compose down -v
